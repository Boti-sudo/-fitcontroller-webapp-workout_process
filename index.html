<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Тренировка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #14181f);
    --hint: var(--tg-theme-hint-color, #77818f);
    --card: var(--tg-theme-secondary-bg-color, #f2f4f7);
    --accent: var(--tg-theme-button-color, #2f80ed);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: #d64545;
    --ok: #2e9e5b;
    --line: color-mix(in srgb, var(--hint) 28%, transparent);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px 16px 92px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  h1 { font-size: 18px; margin: 0 0 2px; }
  h2 { font-size: 15px; font-weight: 500; color: var(--hint); margin: 0 0 18px; }

  label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 5px; }

  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }

  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 64px; }

  .field { margin-bottom: 16px; }

  .note {
    background: var(--card);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
    margin-bottom: 16px;
  }

  .note .cap { font-size: 12px; color: var(--hint); margin-bottom: 4px; }
  .note.empty { color: var(--hint); font-size: 13px; }

  .card { background: var(--card); border-radius: 12px; padding: 13px; margin-bottom: 11px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }

  .num {
    flex: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }

  .ex-name { font-weight: 600; font-size: 14px; }
  .muscle { color: var(--hint); font-weight: 400; }

  .row-cap { font-size: 11px; color: var(--hint); margin: 9px 0 5px; }

  .sets { display: flex; flex-wrap: wrap; gap: 6px; }

  .set {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 13px;
    white-space: nowrap;
  }

  .set.prev { opacity: .75; }
  .set .plan { color: var(--hint); }
  .set input { width: 48px; padding: 3px 4px; text-align: center; border-radius: 6px; font-size: 13px; }
  .set .unit { color: var(--hint); font-size: 12px; }

  button { font: inherit; font-family: inherit; cursor: pointer; border: none; border-radius: 10px; }

  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--line);
    display: grid;
    gap: 8px;
  }

  .btn-primary { background: var(--accent); color: var(--accent-text); padding: 12px; font-weight: 600; }
  .btn-secondary { background: var(--card); color: var(--text); padding: 12px; }
  button:disabled { opacity: .55; cursor: default; }

  .error { color: var(--danger); font-size: 13px; min-height: 18px; }
  .section-title { font-size: 13px; color: var(--hint); margin: 20px 0 8px; }
  .status { color: var(--hint); font-size: 14px; }
  .fatal { color: var(--danger); font-size: 14px; }
  .done { color: var(--ok); font-size: 15px; font-weight: 600; }
</style>
</head>
<body>

<p class="status" id="status">Загружаю тренировку…</p>
<p class="fatal" id="fatal" hidden></p>

<div id="app" hidden>
  <h1 id="complexTitle"></h1>
  <h2 id="dayTitle"></h2>

  <div id="prevComment"></div>
  <div id="lastDate"></div>

  <div class="field" id="weightField">
    <label for="weight">Укажите свой сегодняшний вес, кг</label>
    <input id="weight" type="number" inputmode="decimal" min="30" max="300" step="0.1" placeholder="82.5">
  </div>

  <div class="section-title">Упражнения</div>
  <div id="exercises"></div>

  <div class="field" id="commentField" hidden>
    <label for="comment">Оставить комментарий к тренировке (необязательно)</label>
    <textarea id="comment" maxlength="500" placeholder="Как прошло, что поменять в следующий раз"></textarea>
  </div>
</div>

<div class="bar" id="bar" hidden>
  <div class="error" id="error"></div>
  <button class="btn-secondary" id="close">Закрыть</button>
  <button class="btn-primary" id="action" hidden></button>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
const mainButton = tg && tg.MainButton ? tg.MainButton : null;
if (tg) { tg.ready(); tg.expand(); }

const els = {};
['status','fatal','app','complexTitle','dayTitle','prevComment','weightField','weight',
 'exercises','commentField','comment','bar','error','action','close','lastDate']
  .forEach(id => els[id] = document.getElementById(id));

let api = null;        // базовый адрес сервера бота
let dayId = null;
let plan = null;
let sessionId = null;
let busy = false;

function haptic(type) {
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type);
}

function showError(text) {
  els.error.textContent = text || '';
  if (text) haptic('error');
}

function fail(text) {
  els.status.hidden = true;
  els.fatal.hidden = false;
  els.fatal.textContent = text;
}

// --- обращения к боту ------------------------------------------------------

const REQUEST_TIMEOUT = 20000;

async function callApi(path, options) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);

  let response;
  try {
    response = await fetch(api + path, Object.assign({
      signal: controller.signal,
      headers: {
        'Content-Type': 'application/json',
        'X-Telegram-Init-Data': tg ? tg.initData : '',
        // Бесплатные туннели (pinggy, localtunnel) подсовывают браузерам
        // страницу-предупреждение вместо ответа. Этот заголовок её отключает.
        'X-Pinggy-No-Screen': '1',
      },
    }, options || {}));
  } catch (err) {
    clearTimeout(timer);
    if (err.name === 'AbortError') throw new Error('сервер не ответил за 20 секунд');
    throw err;
  }
  clearTimeout(timer);

  const text = await response.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (e) { /* не JSON */ }

  if (!response.ok) {
    throw new Error((body && body.error) || ('сервер ответил ' + response.status));
  }
  if (body === null || typeof body !== 'object') {
    // Обычно это заглушка туннеля или страница ошибки вместо данных.
    throw new Error('сервер вернул не данные, а страницу — проверь адрес туннеля');
  }
  return body;
}

function networkHint(err) {
  // Самый частый случай: бот выключен или туннель не поднят.
  if (err instanceof TypeError) return 'Бот недоступен. Проверь, что он запущен.';
  return err.message;
}

// --- экран 1: перед тренировкой -------------------------------------------

function renderPrevComment() {
  if (plan.previous_comment) {
    els.prevComment.innerHTML =
      '<div class="note"><div class="cap">Комментарий с прошлой тренировки</div><span></span></div>';
    els.prevComment.querySelector('span').textContent = plan.previous_comment;
  } else {
    els.prevComment.innerHTML =
      '<div class="note empty">Для предыдущей тренировки дополнительных комментариев нет.</div>';
  }
}

function renderLastDate() {
  if (!plan.previous_finished_at) {
    els.lastDate.className = 'note empty';
    els.lastDate.textContent = 'Эту тренировку ты ещё не проводил.';
    return;
  }
  // В базе время в UTC и без метки зоны — дописываем её, иначе дата уедет на часовой пояс.
  const date = new Date(plan.previous_finished_at.replace(' ', 'T') + 'Z');
  els.lastDate.className = 'note';
  els.lastDate.innerHTML =
    '<div class="cap">Дата последней тренировки на эту группу</div><span></span>';
  els.lastDate.querySelector('span').textContent =
    date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function exerciseCard(exercise, index) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.exerciseId = exercise.exercise_id;
  card.dataset.exerciseName = exercise.name;

  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = '<span class="num"></span><span class="ex-name"></span>';
  head.querySelector('.num').textContent = index + 1;

  const nameEl = head.querySelector('.ex-name');
  nameEl.textContent = exercise.name;
  if (exercise.muscle_group) {
    const muscle = document.createElement('span');
    muscle.className = 'muscle';
    muscle.textContent = ' · ' + exercise.muscle_group;
    nameEl.appendChild(muscle);
  }
  card.appendChild(head);
  return card;
}

function setsRow(exercise, mode) {
  const wrap = document.createElement('div');
  wrap.className = 'sets';

  exercise.sets.forEach(set => {
    const el = document.createElement('div');
    el.className = 'set' + (mode === 'prev' ? ' prev' : '');

    if (mode === 'prev') {
      el.innerHTML = '<span class="plan"></span><span class="unit">кг</span>';
      el.querySelector('.plan').textContent =
        set.set_number + ' × ' + set.reps + ' — ' + (set.previous_weight || 0);
    } else {
      el.innerHTML =
        '<span class="plan"></span>' +
        '<input type="number" inputmode="decimal" min="0" max="999" step="0.5" placeholder="0">' +
        '<span class="unit">кг</span>';
      el.querySelector('.plan').textContent = set.set_number + ' × ' + set.reps + ' —';
      el.querySelector('input').dataset.setNumber = set.set_number;
    }
    wrap.appendChild(el);
  });
  return wrap;
}

function caption(text) {
  const el = document.createElement('div');
  el.className = 'row-cap';
  el.textContent = text;
  return el;
}

// --- экран 2: тренировка идёт ---------------------------------------------

function renderWorkout() {
  els.weightField.hidden = true;              // вес уже записан, больше не показываем
  els.lastDate.hidden = true;                 // дата прошлой — справка для старта
  els.commentField.hidden = false;
  if (!plan.previous_comment) els.prevComment.innerHTML = '';

  els.exercises.innerHTML = '';
  plan.exercises.forEach((exercise, index) => {
    const card = exerciseCard(exercise, index);
    card.appendChild(caption('Подходы / повторения / вес (предыдущая тренировка)'));
    card.appendChild(setsRow(exercise, 'prev'));
    card.appendChild(caption('Подходы / повторения / вес (текущая тренировка)'));
    card.appendChild(setsRow(exercise, 'current'));
    els.exercises.appendChild(card);
  });
}

// --- кнопка действия -------------------------------------------------------

let currentHandler = null;

function setAction(text, handler) {
  if (mainButton) {
    if (currentHandler) mainButton.offClick(currentHandler);
    currentHandler = handler;
    mainButton.setText(text);
    mainButton.onClick(handler);
    mainButton.enable();
    mainButton.show();
  } else {
    els.action.hidden = false;
    els.action.textContent = text;
    els.action.onclick = handler;
  }
}

function setBusy(on) {
  busy = on;
  if (mainButton) {
    if (on) { mainButton.showProgress(true); mainButton.disable(); }
    else { mainButton.hideProgress(); mainButton.enable(); }
  } else {
    els.action.disabled = on;
  }
}

// --- действия --------------------------------------------------------------

async function startWorkout() {
  if (busy) return;

  const raw = String(els.weight.value).trim();
  if (!raw) {
    return showError('Заполните вес, для того чтобы начать тренировку.');
  }

  const value = parseFloat(raw.replace(',', '.'));
  if (!Number.isFinite(value) || value < 30 || value > 300) {
    return showError('Укажи сегодняшний вес — число от 30 до 300 кг.');
  }

  showError('');
  setBusy(true);
  try {
    const started = await callApi('/api/session/start', {
      method: 'POST',
      body: JSON.stringify({ day_id: dayId, body_weight_kg: Math.round(value * 10) / 10 }),
    });
    sessionId = started.session_id;
  } catch (err) {
    setBusy(false);
    return showError('Не удалось начать тренировку. ' + networkHint(err));
  }

  setBusy(false);
  haptic('success');
  renderWorkout();
  window.scrollTo(0, 0);
  setAction('Завершить тренировку', finishWorkout);
}

function collectSets() {
  const sets = [];
  for (const card of els.exercises.querySelectorAll('.card')) {
    const exerciseId = parseInt(card.dataset.exerciseId, 10);
    for (const input of card.querySelectorAll('input')) {
      const raw = String(input.value).replace(',', '.').trim();

      // Пустое поле — подход без результата. Тренировку с такими не закрываем:
      // иначе в журнал уедет дыра, и следующая тренировка покажет ноль вместо веса.
      if (raw === '') {
        input.focus();
        return { error: 'Заполни вес во всех подходах — пропущено «'
          + card.dataset.exerciseName + '», подход ' + input.dataset.setNumber + '.' };
      }

      const weight = parseFloat(raw);
      if (!Number.isFinite(weight) || weight < 0 || weight > 999) {
        input.focus();
        return { error: 'Вес должен быть числом от 0 до 999 кг.' };
      }

      sets.push({
        exercise_id: exerciseId,
        set_number: parseInt(input.dataset.setNumber, 10),
        weight_kg: Math.round(weight * 10) / 10,
      });
    }
  }
  return { sets: sets };
}

async function finishWorkout() {
  if (busy) return;

  const collected = collectSets();
  if (collected.error) return showError(collected.error);
  const sets = collected.sets;

  showError('');
  setBusy(true);
  try {
    await callApi('/api/session/finish', {
      method: 'POST',
      body: JSON.stringify({
        session_id: sessionId,
        comment: els.comment.value.trim() || null,
        sets: sets,
      }),
    });
  } catch (err) {
    setBusy(false);
    return showError('Не удалось завершить тренировку. ' + networkHint(err));
  }

  haptic('success');
  if (mainButton) mainButton.hide();
  els.app.hidden = true;
  els.bar.hidden = true;
  els.status.hidden = false;
  els.status.className = 'done';
  els.status.textContent = 'Тренировка записана 💪';
  setTimeout(() => { if (tg) tg.close(); }, 1200);
}

els.close.onclick = () => {
  // До нажатия «Начать» в базе не появляется ничего.
  if (tg) tg.close(); else showError('Закрыть можно только внутри Telegram.');
};

// --- запуск ----------------------------------------------------------------

function readParams() {
  const params = new URLSearchParams(window.location.hash.slice(1));
  api = (params.get('api') || '').replace(/\/+$/, '');
  dayId = parseInt(params.get('day'), 10);
  return api && Number.isInteger(dayId);
}

(async function init() {
  if (!readParams()) {
    return fail('В ссылке нет данных тренировки. Вернись в бота и открой день заново.');
  }
  if (!tg || !tg.initData) {
    return fail('Страница открыта не из Telegram — данные загрузить нельзя.');
  }

  try {
    plan = await callApi('/api/day/' + dayId);

    if (!plan.exercises || !plan.exercises.length) {
      return fail('В этом тренировочном дне нет упражнений.');
    }

    els.complexTitle.textContent = plan.workout_title;
    els.dayTitle.textContent = plan.day_title;
    renderPrevComment();
    renderLastDate();

    els.status.hidden = true;
    els.app.hidden = false;
    els.bar.hidden = false;
    setAction('Начать тренировку', startWorkout);
  } catch (err) {
    fail('Не удалось загрузить тренировку. ' + networkHint(err));
  }
})();
</script>

</body>
</html>
